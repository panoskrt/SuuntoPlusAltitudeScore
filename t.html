<uiView>

  <div id="suuntoplus">

    <!-- Topmost: title field -->
    <div class="cm-fg" style="width:100%;height:25%;">
      <div class="sp-t-s p-hc" style="top:calc(60% - 50%e);">AltiAccli</div>
    </div>

    <!-- Field just under the title, left side -->
    <!-- Field title -->
    <div class="cm-mid sp-t-s" style="top:calc(43% - 100%e);left:calc(26% - 50%e);">Altitude</div>
    <!-- Field value -->
    <div class="sp-d-s f-num" style="top:calc(61% - 100%e);left:calc(26% - 50%e);">
      <eval input="/Zapp/{zapp_index}/Output/altitude" outputFormat="Altitude_Fourdigits" default="--"/>
    </div>

    <!-- Field just under the title, right side -->
    <!-- Field title -->
    <div class="cm-mid sp-t-s" optional style="top:calc(43% - 100%e);left:calc(74% - 50%e);">Score</div>
    <!-- Field value -->
    <div class="sp-d-s f-num" style="top:calc(61% - 100%e);left:calc(74% - 50%e);">
      <!-- 0-100: share of the climb from 1500 m to the current altitude covered by the acclimatized altitude. -->
      <eval input="/Zapp/{zapp_index}/Output/acclimatization" outputFormat="Count_Fourdigits" default="--" />
    </div>

    <!-- Bottom text area -->
    <div class="sp-t-s p-tc p-hc" style="top:calc(73% - 50%e);width:75%;max-height:60px;">
      <!-- status: 0 = below 1500 m, 1 = not acclimatized, 2 = acclimatizing, 3 = acclimatized, 4-6 = caution -->
      <eval input="/Zapp/{zapp_index}/Output/status" outputFormat="script x => (['No altitude stimulus', 'Not acclimatized', 'Acclimatizing', 'Acclimatized', 'Caution: low SpO2', 'Caution: high sleep HR', 'Caution: ascent too fast'][x] || '--')" default="--" />
    </div>
    <div class="cm-mid sp-t-s p-tc p-hc" style="top:calc(84% - 50%e);width:65%;max-height:60px;">
      Adapted to <eval input="/Zapp/{zapp_index}/Output/acclimatizedAltitude" outputFormat="Altitude_Fourdigits" default="--" /> <postfix />, <eval input="/Zapp/{zapp_index}/Output/nightsAtAltitude" outputFormat="Count_Fourdigits" default="--" /> nights
    </div>

    <!-- Lower button opens the last 7 nights graph (g.html) -->
    <:if test="{{ IS_NG3 }}">
      <div class="btn btn-btm">
        <img class="cm-bgc icon" src="hint-btn-bottom.png" />
      </div>
    </:if>
    <:else>
      <img class="btn-btmMask" src="a-sel-d.png" />
    </:else>

    <userInput>
      <pushButton name="down" onClick="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');" />
    </userInput>

  </div>

</uiView>
